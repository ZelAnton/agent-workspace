[package]
name = "agent-workspace"
version = "0.11.0"
edition = "2021"
description = "Git worktree workflow tool for AI coding agents"
license = "MIT"
repository = "https://github.com/ZelAnton/agent-workspace"
keywords = ["cli", "git", "worktree", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dialoguer = "0.12"
rand = "0.10"
ignore = "0.4"
dirs = "6.0.0"
ureq = "3"
self-replace = "1"
tar = "0.4"
flate2 = "1"
tempfile = "3"

[dev-dependencies]
filetime = "0.2"
