[package]
name = "agent-workspace"
version = "0.12.0"
edition = "2024"
rust-version = "1.91"
description = "Git worktree workflow tool for AI coding agents"
license = "MIT"
repository = "https://github.com/ZelAnton/agent-workspace"
keywords = ["cli", "git", "worktree", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dialoguer = "0.12"
rand = "0.10"
ignore = "0.4"
dirs = "6.0.0"
ureq = "3"
self-replace = "1"
tar = "0.4"
flate2 = "1"
tempfile = "3"
vcs-runner = "0.13"
reflink-copy = "0.1"

[target.'cfg(windows)'.dependencies]
# Volume-serial-number lookup for the CoW same-volume probe.
# `std::os::windows::fs::MetadataExt::volume_serial_number` is nightly-only
# (#63010); winapi-util wraps `GetFileInformationByHandle` on stable.
# Already in our dep tree transitively via `ignore` → `walkdir`.
winapi-util = "0.1"

[dev-dependencies]
filetime = "0.2"
# vcs-runner re-exports procpilot, but the `testing` feature (MockRunner) is
# off by default. Pull procpilot directly with `testing` enabled so unit tests
# in src/vcs/git/ can mock subprocess calls without spawning real git.
procpilot = { version = "0.8", features = ["testing"] }
