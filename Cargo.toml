[package]
name = "agent-workspace"
version = "0.15.0"
edition = "2024"
rust-version = "1.91"
description = "Git worktree workflow tool for AI coding agents"
license = "MIT"
repository = "https://github.com/ZelAnton/agent-workspace"
keywords = ["cli", "git", "worktree", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
# `toml_edit` preserves comments and formatting when rewriting an
# existing TOML file — used by `ws config set/unset` so the user's
# hand-written `.agent-workspace.toml` doesn't get reflowed into
# canonical form on every write.
toml_edit = "0.22"
# TUI stack for `ws exclude`'s interactive tree picker.
# ratatui re-exports a version-compatible crossterm; pinning crossterm
# separately to the same version avoids `Event`-type drift errors.
# tui-tree-widget gives us a TreeState + TreeItem with built-in open/
# close + selection state — the only third-party widget we need.
# humansize renders the per-folder byte totals as "450 MB" etc.
ratatui = "0.29"
crossterm = "0.28"
tui-tree-widget = "0.23"
humansize = "2.1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dialoguer = "0.12"
rand = "0.10"
ignore = "0.4"
dirs = "6.0.0"
ureq = "3"
self-replace = "1"
tar = "0.4"
flate2 = "1"
tempfile = "3"
# VCS layer is built on our published, consolidated crates: the `vcs-core`
# facade (backend detection + a git/jj-agnostic `Repo` handle), `processkit`
# (async job-backed process runner — kill-on-dispose process trees), and the
# typed `vcs-git`/`vcs-jj`/`vcs-github` clients that drive the matching CLI on
# top of it. Common ops go through `vcs-core::Repo` — its facade methods
# (`trunk`, `in_progress_state`, `cleanup_worktree_blocking`) and its cwd-bound
# views (`git_at`/`jj_at`) back `ws`'s query helpers; the tool-specific escape
# hatches (`repo.git()?` / `repo.jj()?`) drive the CoW flow, op-log rollback, and
# the merge/rebase state machines that stay in `ws` (fetch retry now lives in the
# toolkit clients). `vcs-core` re-exports `vcs_git`/`vcs_jj`, but we keep them as
# direct deps for the `mock` feature and the escape-hatch types.
vcs-core = "0.2"
processkit = "0.6"
vcs-git = "0.4"
vcs-jj = "0.4"
vcs-github = "0.4"
# `processkit` (and the vcs-* clients) are async; `ws` therefore runs on a tokio
# runtime. A `current_thread` runtime suffices (the CLI awaits subprocesses
# sequentially, no concurrency to exploit) — `rt` gives the runtime +
# `spawn_blocking`'s blocking pool (used by the CoW reflink copy); `macros`
# provides `#[tokio::main]`.
tokio = { version = "1", features = ["rt", "macros"] }
reflink-copy = "0.1"

# Progress bars for the CoW reflink clone in `ws new`. On 20+ GB monorepos
# the clone can take meaningful wall time; a visual progress bar makes the
# wait obvious instead of a blank tab. Auto-detects TTY (no-op when stderr
# is piped, so scripts stay quiet).
indicatif = "0.17"

# Parallel file copy in the CoW clone path. Sequential reflinking is
# bottlenecked by per-file syscall overhead (open + stat + create + sparse
# IOCTL + integrity IOCTL + set_len + FSCTL_DUPLICATE_EXTENTS_TO_FILE — 7
# syscalls per file even on ReFS fast-path), so wall time scales linearly
# with file count even when the actual block-clone is near-instant. rayon
# distributes that over all cores; matches robocopy's `/MT:N` model.
rayon = "1"

[target.'cfg(windows)'.dependencies]
# Volume-serial-number lookup for the CoW same-volume probe.
# `std::os::windows::fs::MetadataExt::volume_serial_number` is nightly-only
# (#63010); winapi-util wraps `GetFileInformationByHandle` on stable.
# Already in our dep tree transitively via `ignore` → `walkdir`.
winapi-util = "0.1"

# Read the Windows Internet Settings registry key so `ws update` (and any
# future HTTP call) automatically routes through the IT-managed corporate
# proxy. Without this feature ureq only reads HTTPS_PROXY / HTTP_PROXY env
# vars, which corporate machines typically don't set.
ureq = { version = "3", features = ["win-system-proxy"] }

[dev-dependencies]
filetime = "0.2"
# `tokio`'s test macro for the async unit tests in src/vcs/. (The non-test
# features are already pulled in by the main `tokio` dependency above.)
tokio = { version = "1", features = ["rt", "macros"] }
# processkit ships its `ScriptedRunner`/`RecordingRunner` test doubles in the
# main crate (always available); the `mock` feature adds the mockall-generated
# `MockProcessRunner`. vcs-git/vcs-jj re-expose `MockGitApi`/`MockJjApi` behind
# their own `mock` feature, used to drive the backend unit tests without
# spawning a real git/jj binary.
vcs-git = { version = "0.4", features = ["mock"] }
vcs-jj = { version = "0.4", features = ["mock"] }
