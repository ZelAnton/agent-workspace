name: Release

# Triggered by pushing a tag like `v0.11.0` OR manually via the Actions
# UI ("Run workflow" button) for the first-time setup and emergency
# reruns. Produces a GitHub Release with prebuilt binaries for all four
# supported platforms plus the install scripts (consumed by install.sh /
# install.ps1), and publishes the npm packages.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.11.0). Required for manual runs.'
        required: true
        type: string
      publish_npm:
        description: 'Publish to npm registry'
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # required by softprops/action-gh-release

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin: wt
          - os: macos-latest      # arm64 by default; Intel (macos-13) dropped — runner unreliable
            target: aarch64-apple-darwin
            platform: darwin-arm64
            bin: wt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            bin: wt.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Migrated off dtolnay/rust-toolchain in v0.12.10. The upstream
      # maintainer removed the @stable / @nightly / @beta moving tags in
      # mid-2026, AND GitHub Actions' codeload was returning 404 for every
      # SHA in that repo (works via direct curl — Actions-specific routing
      # issue we couldn't get around). actions-rust-lang/setup-rust-toolchain
      # is the official successor: same API surface, actively maintained,
      # different codeload entry that resolves fine.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # On tag push: derive from GITHUB_REF_NAME (e.g. "v0.11.0" → "0.11.0").
          # On manual dispatch: use the workflow input.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Package the single binary as tar.gz. Windows 10 1803+ ships bsdtar, so
      # using tar.gz for all platforms keeps `wt update` and install scripts
      # simple (one archive format, one extractor).
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          BIN="${{ matrix.bin }}"
          ARCHIVE="agent-workspace-${VERSION}-${PLATFORM}.tar.gz"

          # Strip debug symbols to shrink the archive.
          strip "target/${{ matrix.target }}/release/${BIN}" || true

          # tar from inside the release dir so the archive has wt at top level.
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${BIN}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package_unix

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          BIN="${{ matrix.bin }}"
          ARCHIVE="agent-workspace-${VERSION}-${PLATFORM}.tar.gz"

          # Windows runner has tar.exe; use bash for consistent syntax.
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${BIN}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package_win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-${{ matrix.platform }}
          path: agent-workspace-*.tar.gz
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for install scripts)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        # Only run on tag pushes; for manual dispatch, skip the GH release
        # step (use case is npm-republish without re-tagging).
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent-workspace-*.tar.gz
            install.sh
            install.ps1
            uninstall.sh
            uninstall.ps1
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Skip when the manual dispatcher unchecked the publish_npm flag.
    # Tag pushes always publish (workflow_dispatch.inputs is null on push).
    if: github.event_name == 'push' || inputs.publish_npm
    # OIDC Trusted Publishing: GitHub mints a short-lived ID token for
    # this job, npm verifies it against each package's Trusted Publisher
    # config (configured per-package on npmjs.com). No long-lived token
    # in repository secrets — `npm publish --provenance` uses the OIDC
    # flow + records cryptographic provenance attestations.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Node 20 ships with npm 10.x. OIDC Trusted Publishing (publish
      # without a long-lived token, verified via GitHub's OIDC ID token)
      # requires npm CLI >= 11.5.1 — the feature went GA in May 2025.
      # Without this upgrade, npm falls back to token auth, finds no
      # token, and the registry returns 404 (auth failures are masked as
      # "not found" by design). Provenance signing still works on older
      # npm, so the sigstore step succeeds before the PUT fails.
      - name: Upgrade npm to >=11.5.1 (required for OIDC Trusted Publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false   # keep per-platform dirs so we can stage them

      - name: Stage binaries into npm/<platform>/bin
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          for platform in darwin-arm64 linux-x64 win32-x64; do
            archive="dist/agent-workspace-${platform}/agent-workspace-${VERSION}-${platform}.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "::error::Archive not found: $archive"
              exit 1
            fi
            target="npm/agent-workspace-${platform}/bin"
            mkdir -p "$target"
            tar -xzf "$archive" -C "$target"
            # Ensure the unix binaries are executable post-extract.
            if [[ "$platform" != "win32-x64" ]]; then
              chmod +x "$target/wt"
            fi
            echo "Staged $platform → $target"
            ls -la "$target"
          done

      - name: Publish to npm (OIDC + provenance)
        # No NODE_AUTH_TOKEN: the npm CLI picks up the GitHub OIDC token
        # automatically via ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN env vars
        # (provided when `permissions: id-token: write` is set above).
        # `--provenance` is passed inside `publish-npm.sh` for every
        # `npm publish` invocation.
        run: bash scripts/publish-npm.sh "${{ steps.version.outputs.version }}"
