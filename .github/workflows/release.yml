name: Release

# Manual-trigger only. Click "Run workflow" in the GitHub Actions UI,
# enter the version to release (e.g. `0.13.14`), and the workflow:
#   1. Builds release binaries for all three supported platforms.
#   2. Creates a GitHub Release at the current commit with tag `v<version>`
#      (the tag is created by `gh release create`; we don't push it
#      separately).
#   3. Publishes the npm packages (toggleable via the checkbox).
#
# We removed the `push: tags: ['v*']` auto-trigger that earlier
# versions used because it kicked off a full ~10-minute release pipeline
# on every accidental tag push. Bumping Cargo.toml + a tag is now
# decoupled from publishing; the maintainer reviews the staged change,
# decides it's ready, and clicks Run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.13.14, no leading `v`).'
        required: true
        type: string
      publish_npm:
        description: 'Publish to npm registry'
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # required by softprops/action-gh-release

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin: ws
          - os: macos-latest      # arm64 by default; Intel (macos-13) dropped — runner unreliable
            target: aarch64-apple-darwin
            platform: darwin-arm64
            bin: ws
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            bin: ws.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No third-party Rust setup action — GitHub Actions codeload had a
      # multi-day outage in May 2026 where it served 404 for every SHA of
      # `dtolnay/rust-toolchain`, then for its successor
      # `actions-rust-lang/setup-rust-toolchain`, while the same SHAs worked
      # via direct curl. The only resilient path is to use the pre-installed
      # rustup that ships with every GH-hosted runner image (ubuntu-latest /
      # macos-latest / windows-latest). `rustup target add` is a no-op when
      # building for the host target, but kept explicit for cross-target
      # safety / clarity. Same reasoning drops `Swatinem/rust-cache@v2` —
      # release builds happen rarely enough that a cold cargo cache is fine.
      - name: Setup Rust (rustup native, no third-party actions)
        shell: bash
        run: |
          set -eu
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      # The release version comes from the manual `inputs.version` form
      # field. It MUST be stamped into Cargo.toml before the build so the
      # compiled binary's `env!("CARGO_PKG_VERSION")` matches the release
      # tag — otherwise `ws update` downloads the new asset but installs a
      # binary that still reports the repo's dev version, and every
      # subsequent `ws update` sees the same version gap and "updates"
      # forever. awk (not sed -i, whose flag differs across GNU/BSD/git-bash)
      # rewrites only the first `^version = "…"` line, i.e. the [package]
      # version — dependency `version =` keys are indented or inline so they
      # never match the start-anchored pattern.
      - name: Stamp release version into Cargo.toml
        shell: bash
        run: |
          set -eu
          VERSION="${{ inputs.version }}"
          awk -v v="$VERSION" '
            /^version = "/ && !done { print "version = \"" v "\""; done=1; next }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          echo "Cargo.toml now: $(grep -m1 '^version = ' Cargo.toml)"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Workflow is manual-only; the version always comes from the
          # `inputs.version` field on the "Run workflow" form.
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      # Package the single binary as tar.gz. Windows 10 1803+ ships bsdtar, so
      # using tar.gz for all platforms keeps `ws update` and install scripts
      # simple (one archive format, one extractor).
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          BIN="${{ matrix.bin }}"
          ARCHIVE="agent-workspace-${VERSION}-${PLATFORM}.tar.gz"

          # Strip debug symbols to shrink the archive.
          strip "target/${{ matrix.target }}/release/${BIN}" || true

          # tar from inside the release dir so the archive has ws at top level.
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${BIN}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package_unix

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          BIN="${{ matrix.bin }}"
          ARCHIVE="agent-workspace-${VERSION}-${PLATFORM}.tar.gz"

          # Windows runner has tar.exe; use bash for consistent syntax.
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${BIN}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package_win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-${{ matrix.platform }}
          path: agent-workspace-*.tar.gz
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for install scripts)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      # Publish GH Release via the gh CLI (pre-installed on ubuntu-latest)
      # — replaces softprops/action-gh-release which we dropped during the
      # May 2026 codeload outage that took out third-party actions.
      #
      # `gh release create` both creates the tag (at `--target`, which
      # defaults to the branch we ran from — usually `main`) AND
      # publishes the Release record with the staged assets. We don't
      # push the tag manually beforehand.
      - name: Publish GitHub Release (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          TAG="v${{ steps.version.outputs.version }}"
          # Stage all assets in a flat list so `gh release create` picks them up.
          mapfile -t archives < <(ls dist/agent-workspace-*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::no archives staged in dist/"
            exit 1
          fi
          # Verify each expected install/uninstall script is present at repo root.
          for f in install.sh install.ps1 uninstall.sh uninstall.ps1; do
            if [[ ! -f "$f" ]]; then
              echo "::error::missing $f at repo root"
              exit 1
            fi
          done
          gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ github.sha }}" \
            --generate-notes \
            "${archives[@]}" \
            install.sh install.ps1 uninstall.sh uninstall.ps1

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Skip when the manual dispatcher unchecked the publish_npm flag.
    if: inputs.publish_npm
    # OIDC Trusted Publishing: GitHub mints a short-lived ID token for
    # this job, npm verifies it against each package's Trusted Publisher
    # config (configured per-package on npmjs.com). No long-lived token
    # in repository secrets — `npm publish --provenance` uses the OIDC
    # flow + records cryptographic provenance attestations.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Node 20 ships with npm 10.x. OIDC Trusted Publishing (publish
      # without a long-lived token, verified via GitHub's OIDC ID token)
      # requires npm CLI >= 11.5.1 — the feature went GA in May 2025.
      # Without this upgrade, npm falls back to token auth, finds no
      # token, and the registry returns 404 (auth failures are masked as
      # "not found" by design). Provenance signing still works on older
      # npm, so the sigstore step succeeds before the PUT fails.
      - name: Upgrade npm to >=11.5.1 (required for OIDC Trusted Publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false   # keep per-platform dirs so we can stage them

      - name: Stage binaries into npm/<platform>/bin
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          for platform in darwin-arm64 linux-x64 win32-x64; do
            archive="dist/agent-workspace-${platform}/agent-workspace-${VERSION}-${platform}.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "::error::Archive not found: $archive"
              exit 1
            fi
            target="npm/agent-workspace-${platform}/bin"
            mkdir -p "$target"
            tar -xzf "$archive" -C "$target"
            # Ensure the unix binaries are executable post-extract.
            if [[ "$platform" != "win32-x64" ]]; then
              chmod +x "$target/ws"
            fi
            echo "Staged $platform → $target"
            ls -la "$target"
          done

      - name: Publish to npm (OIDC + provenance)
        # No NODE_AUTH_TOKEN: the npm CLI picks up the GitHub OIDC token
        # automatically via ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN env vars
        # (provided when `permissions: id-token: write` is set above).
        # `--provenance` is passed inside `publish-npm.sh` for every
        # `npm publish` invocation.
        run: bash scripts/publish-npm.sh "${{ steps.version.outputs.version }}"
