name: Release

# Manual-trigger only. Click "Run workflow" in the GitHub Actions UI and pick
# a bump type (patch/minor/major). The workflow then:
#   1. `prepare`: derives the next version from Cargo.toml, refuses to reuse an
#      existing tag, checks the required release files exist, auto-fills
#      CHANGELOG.md's [Unreleased] from git-cliff if it has no manual bullets,
#      extracts curated release notes, and promotes [Unreleased] -> [version].
#   2. `build`: compiles release binaries for all three platforms with the new
#      version stamped into Cargo.toml.
#   3. `publish-npm`: dry-run-validates then publishes the npm packages
#      (toggleable). This is the PIVOT — see the ordering note below.
#   4. `release`: only AFTER npm has published (or was skipped) — commits the
#      version bump + changelog back to main, pushes the tag atomically, and
#      publishes the GitHub Release using the curated notes.
#
# Ordering for failure-safety (see AGENTS.md "Releasing"): npm publish is the
# ONE irreversible step (a version can never be re-published), so it runs as the
# pivot BEFORE anything is pushed to git. A failed npm publish strands nothing —
# no tag, no bumped `main`, no Release — so you just re-run (npm publish is
# idempotent: already-published packages are skipped, transient errors retried).
# The reversible/recreatable steps after it (tag, GitHub Release) are made
# idempotent + retried so they can never drop a completed release. The dangerous
# state — a bumped `main`/tag with no published artifact, or a re-run that skips
# a version — is thereby unreachable from any single-step failure.
#
# There is no `push:`/`tag:` auto-trigger — releasing is always a deliberate
# manual action. The version number is NEVER typed by hand: pick the bump and
# the source-of-truth (Cargo.toml) drives everything, then gets committed back
# so Cargo.toml, the git tag, and the GitHub Release never drift apart.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      publish_npm:
        description: 'Publish to npm registry'
        required: false
        type: boolean
        default: true

# Never run two releases at once — they both bump + commit to main.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare version + release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
    steps:
      # Releases always come from main. The workflow_dispatch UI always shows a
      # branch picker (it can't be hidden); refuse any non-main dispatch so the
      # version/changelog/tag can never be derived from a feature branch.
      - name: Enforce dispatch from main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Release must be dispatched from main (got '${{ github.ref_name }}'). Re-run 'Run workflow' and select the main branch."
          exit 1

      - name: Checkout main (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 -oP '(?<=^version = ")[^"]+' Cargo.toml)
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse current version from Cargo.toml (got: '$CURRENT')"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "prev_tag=v$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      # Preflight the files every downstream job depends on, BEFORE the build /
      # irreversible npm publish — a missing install script or npm package dir
      # should fail here (cheap, nothing released yet), not after npm has already
      # consumed the version. (No publish *token* to check: npm uses OIDC Trusted
      # Publishing and the GitHub Release uses the auto GITHUB_TOKEN.)
      - name: Preflight required release files
        run: |
          set -euo pipefail
          missing=0
          for f in install.sh install.ps1 uninstall.sh uninstall.ps1 scripts/publish-npm.sh cliff.toml; do
            [ -f "$f" ] || { echo "::error::missing required release file: $f"; missing=1; }
          done
          if [ "${{ inputs.publish_npm }}" = "true" ]; then
            for d in agent-workspace agent-workspace-darwin-arm64 agent-workspace-linux-x64 agent-workspace-win32-x64; do
              [ -f "npm/$d/package.json" ] || { echo "::error::missing npm/$d/package.json"; missing=1; }
            done
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2

      - name: Auto-fill [Unreleased] from git log if empty
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          prev_tag = os.environ["PREV_TAG"]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not m:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          body = m.group(1)
          has_real_bullets = any(re.match(r"^-\s+\S", ln) for ln in body.splitlines())
          if has_real_bullets:
              print("[Unreleased] already has manual entries; skipping auto-fill.")
              sys.exit(0)

          tag_exists = subprocess.run(
              ["git", "rev-parse", "--verify", prev_tag], capture_output=True
          ).returncode == 0

          if tag_exists:
              print(f"[Unreleased] is empty; generating from git log since {prev_tag}...")
              cliff_cmd = ["git-cliff", "--config", "cliff.toml", "--strip", "all", f"{prev_tag}..HEAD"]
              empty_hint = (
                  f"::error::No release-worthy commits found between {prev_tag} and HEAD. "
                  "Either add a manual entry to [Unreleased] in CHANGELOG.md, or commit "
                  "changes with a recognised prefix (feat/fix/perf/ux/refactor/remove/...)."
              )
          else:
              print(f"[Unreleased] is empty; tag {prev_tag} not found — generating from full git history...")
              cliff_cmd = ["git-cliff", "--config", "cliff.toml", "--strip", "all"]
              empty_hint = (
                  "::error::No release-worthy commits found in git history. "
                  "Either add a manual entry to [Unreleased] in CHANGELOG.md, or commit "
                  "changes with a recognised prefix (feat/fix/perf/ux/refactor/remove/...)."
              )

          result = subprocess.run(cliff_cmd, check=True, capture_output=True, text=True)
          generated = result.stdout.strip()
          if not generated:
              print(empty_hint, file=sys.stderr)
              sys.exit(1)

          new_text = text[: m.start(1)] + generated + "\n\n" + text[m.end(1) :]
          path.write_text(new_text)
          print("----- auto-generated [Unreleased] body -----")
          print(generated)
          print("--------------------------------------------")
          PY

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = (m.group(1) if m else "").strip()

          # Keep "### Header" only if it has at least one real bullet ("- text").
          # Drop placeholder "-" lines and empty sections so notes are clean.
          parts = re.split(r"(?m)(^### .+$)", body)
          out = []
          for i in range(1, len(parts), 2):
              header = parts[i]
              section = parts[i + 1] if i + 1 < len(parts) else ""
              bullets = [ln for ln in section.splitlines() if re.match(r"^-\s+\S", ln)]
              if bullets:
                  if out:
                      out.append("")
                  out.append(header)
                  out.extend(bullets)

          result = "\n".join(out).strip()
          if not result:
              print(
                  "::error::[Unreleased] section in CHANGELOG.md is empty. "
                  "Add release notes before releasing.",
                  file=sys.stderr,
              )
              sys.exit(1)

          pathlib.Path("release-notes.md").write_text(result + "\n")
          print("----- release-notes.md -----")
          print(result)
          print("----------------------------")
          PY

      - name: Promote Unreleased section in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          prev_tag = os.environ["PREV_TAG"]
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          repo = "https://github.com/ZelAnton/agent-workspace"

          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          new_unreleased = (
              "## [Unreleased]\n\n"
              "### Added\n-\n\n"
              "### Changed\n-\n\n"
              "### Fixed\n-\n\n"
              f"## [{version}] - {date}"
          )
          text, n = re.subn(r"^## \[Unreleased\]$", new_unreleased, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          link_replacement = (
              f"[Unreleased]: {repo}/compare/{tag}...HEAD\n"
              f"[{version}]: {repo}/compare/{prev_tag}...{tag}"
          )
          text, n = re.subn(r"^\[Unreleased\]:.*$", link_replacement, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '[Unreleased]: ...' reference link in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          path.write_text(text)
          print("Promoted [Unreleased] -> [%s] - %s" % (version, date))
          PY

      - name: Upload changelog + release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            CHANGELOG.md
            release-notes.md
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin: ws
          - os: macos-latest      # arm64 by default; Intel (macos-13) dropped — runner unreliable
            target: aarch64-apple-darwin
            platform: darwin-arm64
            bin: ws
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            bin: ws.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No third-party Rust setup action — GitHub Actions codeload had a
      # multi-day outage in May 2026 where it served 404 for every SHA of
      # `dtolnay/rust-toolchain`, then for its successor
      # `actions-rust-lang/setup-rust-toolchain`, while the same SHAs worked
      # via direct curl. The only resilient path is to use the pre-installed
      # rustup that ships with every GH-hosted runner image (ubuntu-latest /
      # macos-latest / windows-latest). `rustup target add` is a no-op when
      # building for the host target, but kept explicit for cross-target
      # safety / clarity. Same reasoning drops `Swatinem/rust-cache@v2` —
      # release builds happen rarely enough that a cold cargo cache is fine.
      - name: Setup Rust (rustup native, no third-party actions)
        shell: bash
        run: |
          set -eu
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      # The release version is computed once in the `prepare` job and stamped
      # into Cargo.toml here, before the build, so the compiled binary's
      # `env!("CARGO_PKG_VERSION")` matches the release tag — otherwise
      # `ws update` downloads the new asset but installs a binary that still
      # reports the old version, and every subsequent `ws update` sees the same
      # version gap and "updates" forever. awk (not sed -i, whose flag differs
      # across GNU/BSD/git-bash) rewrites only the first `^version = "…"` line,
      # i.e. the [package] version.
      - name: Stamp release version into Cargo.toml
        shell: bash
        run: |
          set -eu
          VERSION="${{ needs.prepare.outputs.version }}"
          awk -v v="$VERSION" '
            /^version = "/ && !done { print "version = \"" v "\""; done=1; next }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          echo "Cargo.toml now: $(grep -m1 '^version = ' Cargo.toml)"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      # Package the single binary as tar.gz. Windows 10 1803+ ships bsdtar, so
      # using tar.gz for all platforms keeps `ws update` and install scripts
      # simple (one archive format, one extractor).
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          BIN="${{ matrix.bin }}"
          ARCHIVE="agent-workspace-${VERSION}-${PLATFORM}.tar.gz"

          # Strip debug symbols to shrink the archive.
          strip "target/${{ matrix.target }}/release/${BIN}" || true

          # tar from inside the release dir so the archive has ws at top level.
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${BIN}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package_unix

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          BIN="${{ matrix.bin }}"
          ARCHIVE="agent-workspace-${VERSION}-${PLATFORM}.tar.gz"

          # Windows runner has tar.exe; use bash for consistent syntax.
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${BIN}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package_win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-${{ matrix.platform }}
          path: agent-workspace-*.tar.gz
          retention-days: 7

  release:
    name: Publish release (tag + GitHub Release, after npm)
    needs: [prepare, build, publish-npm]
    # Run only AFTER the npm pivot published (or was skipped via publish_npm
    # unchecked). `!cancelled()` is required so a SKIPPED publish-npm doesn't
    # cascade a skip onto this job — while still HONORING an actual workflow
    # cancellation (unlike `always()`, which would push the tag/Release even
    # after the user cancels). The explicit result checks keep it from running
    # when prepare/build FAILED or when npm publish FAILED. Net effect: a failed
    # (or cancelled) npm publish leaves NO tag, NO bumped main, NO GitHub
    # Release — re-run is clean.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (for commit + install scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: agent-workspace-*
          merge-multiple: true

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: release-meta

      - name: List artifacts
        run: ls -la dist/ release-meta/

      # Apply the promoted CHANGELOG.md + curated release-notes.md produced by
      # `prepare`, and stamp the new version into Cargo.toml + Cargo.lock so the
      # commit pushed back to main keeps all three in lockstep with the tag.
      - name: Apply changelog + stamp version
        shell: bash
        run: |
          set -euo pipefail
          # Only CHANGELOG.md is copied into the tree (it gets committed below).
          # The curated notes stay in the download dir (release-meta/) and are
          # read straight from there by the Release step — nothing untracked is
          # written into the working tree.
          cp release-meta/CHANGELOG.md CHANGELOG.md
          VERSION="${{ needs.prepare.outputs.version }}"
          awk -v v="$VERSION" '
            /^version = "/ && !done { print "version = \"" v "\""; done=1; next }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          # Keep Cargo.lock's own package entry in sync (only the agent-workspace
          # block — leave dependency versions untouched).
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          p = pathlib.Path("Cargo.lock")
          t = p.read_text()
          t2, n = re.subn(
              r'(\[\[package\]\]\nname = "agent-workspace"\nversion = ")[^"]+(")',
              r"\g<1>" + v + r"\g<2>",
              t,
              count=1,
          )
          if n != 1:
              print("::error::Could not find agent-workspace package entry in Cargo.lock", file=sys.stderr)
              sys.exit(1)
          p.write_text(t2)
          PY
          echo "Cargo.toml: $(grep -m1 '^version = ' Cargo.toml)"

      # Idempotent so a "Re-run failed jobs" (after a prior run pushed the bump
      # but failed at the GitHub Release step) flows straight through to the
      # idempotent Release step instead of dying here on "nothing to commit" /
      # "tag already exists" / non-fast-forward. The re-run reuses the SAME
      # cached prepare outputs (this version), so it never bumps — only a full
      # workflow re-DISPATCH does, which the Release step still warns against.
      - name: Commit, tag, push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          # Skip the commit if the bump is already committed (re-run: checkout of
          # main already contains it, and re-applying the same changes stages
          # nothing).
          if git diff --cached --quiet; then
            echo "Bump already committed — skipping commit."
          else
            git commit -m "Release ${TAG}"
          fi
          # Create the tag only if it isn't already present locally.
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || git tag "${TAG}"
          # Push branch + tag atomically. If both refs are already at the remote
          # state (prior run pushed them), this is a no-op "Everything up-to-date"
          # and exits 0. If the push is rejected, verify the remote is exactly the
          # expected released state and continue; otherwise fail loudly.
          if git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${TAG}"; then
            echo "Pushed bump commit + ${TAG}."
          else
            git fetch --quiet origin main "refs/tags/${TAG}" || true
            if git merge-base --is-ancestor HEAD origin/main \
               && git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
              echo "Bump commit + ${TAG} are already on origin — continuing to Release."
            else
              echo "::error::push failed and origin is not in the expected released state for ${TAG}."
              exit 1
            fi
          fi

      # Last, and AFTER the npm pivot + the tag push: attach the GitHub Release.
      # It must never be the step that *loses* a completed release, so it is
      # idempotent (edit + re-upload assets if a prior attempt created it,
      # otherwise create) and retried. If it still fails, the error says to
      # finish by hand and NOT re-run — a re-run reads the already-bumped version
      # from main and would ship the NEXT version, stranding this tag's Release.
      - name: Publish GitHub Release (gh CLI, idempotent + retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          NOTES="release-meta/release-notes.md"
          # nullglob so a no-match yields an empty array (not the literal glob),
          # avoiding any `ls`-output parsing.
          shopt -s nullglob
          archives=( dist/agent-workspace-*.tar.gz )
          shopt -u nullglob
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::no archives staged in dist/"
            exit 1
          fi
          for f in install.sh install.ps1 uninstall.sh uninstall.ps1; do
            if [[ ! -f "$f" ]]; then
              echo "::error::missing $f at repo root"
              exit 1
            fi
          done
          assets=( "${archives[@]}" install.sh install.ps1 uninstall.sh uninstall.ps1 )
          attempt=0
          max=3
          while :; do
            attempt=$((attempt + 1))
            if gh release view "$TAG" >/dev/null 2>&1; then
              # A prior attempt already created it — update notes/title and
              # (re-)upload assets, clobbering any partial uploads.
              # `--clobber` BEFORE the positionals so it's parsed as a flag even
              # if gh ever disables flag interspersing (otherwise it could be
              # taken as a filename and break this idempotent re-upload path).
              if gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" \
                && gh release upload --clobber "$TAG" "${assets[@]}"; then
                break
              fi
            else
              if gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" "${assets[@]}"; then
                break
              fi
            fi
            if [[ "$attempt" -ge "$max" ]]; then
              echo "::error::${TAG} is tagged (and npm-published, if enabled) but creating the GitHub Release failed after ${max} attempts. Recover with 'Re-run failed jobs' (reuses ${TAG}; every step is idempotent), or finish by hand: gh release create ${TAG} --notes-file <notes> <assets>. Do NOT RE-DISPATCH the whole workflow — that re-reads the already-bumped Cargo.toml and would ship the NEXT version, orphaning ${TAG}."
              exit 1
            fi
            echo "::warning::GitHub Release attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done

  publish-npm:
    name: Publish to npm
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Skip when the manual dispatcher unchecked the publish_npm flag.
    if: inputs.publish_npm
    # OIDC Trusted Publishing: GitHub mints a short-lived ID token for
    # this job, npm verifies it against each package's Trusted Publisher
    # config (configured per-package on npmjs.com). No long-lived token
    # in repository secrets — `npm publish --provenance` uses the OIDC
    # flow + records cryptographic provenance attestations.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Node 20 ships with npm 10.x. OIDC Trusted Publishing (publish
      # without a long-lived token, verified via GitHub's OIDC ID token)
      # requires npm CLI >= 11.5.1 — the feature went GA in May 2025.
      # Without this upgrade, npm falls back to token auth, finds no
      # token, and the registry returns 404 (auth failures are masked as
      # "not found" by design). Provenance signing still works on older
      # npm, so the sigstore step succeeds before the PUT fails.
      - name: Upgrade npm to >=11.5.1 (required for OIDC Trusted Publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: agent-workspace-*
          merge-multiple: false   # keep per-platform dirs so we can stage them

      - name: Stage binaries into npm/<platform>/bin
        shell: bash
        run: |
          set -eu
          VERSION="${{ needs.prepare.outputs.version }}"
          for platform in darwin-arm64 linux-x64 win32-x64; do
            archive="dist/agent-workspace-${platform}/agent-workspace-${VERSION}-${platform}.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "::error::Archive not found: $archive"
              exit 1
            fi
            target="npm/agent-workspace-${platform}/bin"
            mkdir -p "$target"
            tar -xzf "$archive" -C "$target"
            # Ensure the unix binaries are executable post-extract.
            if [[ "$platform" != "win32-x64" ]]; then
              chmod +x "$target/ws"
            fi
            echo "Staged $platform → $target"
            ls -la "$target"
          done

      # Cheap validation BEFORE the irreversible publish: pack each package
      # exactly as `npm publish` would, but without uploading (`--dry-run`),
      # catching packaging/metadata errors without consuming the version.
      - name: Validate npm packages (dry run)
        run: bash scripts/publish-npm.sh "${{ needs.prepare.outputs.version }}" true

      # The PIVOT — the one irreversible step, run before any tag/Release exists
      # (the `release` job depends on this job). A failure here strands nothing:
      # re-run and the script skips already-published packages and retries
      # transient errors (see scripts/publish-npm.sh).
      #
      # No NODE_AUTH_TOKEN: the npm CLI picks up the GitHub OIDC token
      # automatically via ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN env vars (provided
      # when `permissions: id-token: write` is set above). `--provenance` is
      # passed inside `publish-npm.sh` for every real `npm publish`.
      - name: Publish to npm (OIDC + provenance)
        run: bash scripts/publish-npm.sh "${{ needs.prepare.outputs.version }}"
