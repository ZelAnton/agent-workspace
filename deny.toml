# cargo-deny configuration. CI runs `cargo deny check advisories bans`
# (see .github/workflows/ci.yml). Licenses/sources are not gated for now.

[advisories]
# Fail on crates with a RustSec security advisory or that have been yanked.
version = 2
yanked = "deny"
# "unmaintained" advisories are quality signals, not vulnerabilities. Only fail
# when a crate WE depend on directly is unmaintained — deep transitive deps of
# well-kept crates are out of our control and would otherwise make
# `check advisories` perpetually red.
unmaintained = "workspace"

[bans]
# Duplicate versions of the same crate are a warning, not a hard failure.
multiple-versions = "warn"
# Wildcard version requirements hide breakage; flag them.
wildcards = "deny"
